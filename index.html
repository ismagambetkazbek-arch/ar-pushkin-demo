<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR-учебник — Пушкин</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:0!important}a-scene canvas{background:transparent!important}.ui{position:fixed;z-index:9;left:12px;right:12px;padding:12px;border-radius:14px;background:rgba(15,23,42,.88);border:1px solid #ffffff44}.top{top:max(12px,env(safe-area-inset-top))}.bottom{bottom:max(12px,env(safe-area-inset-bottom))}h1{font-size:18px;margin:0 0 5px}p{font-size:13px;line-height:1.35;margin:4px 0}#status{font-weight:bold;color:#fde68a}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{padding:12px 6px;border:0;border-radius:10px;background:#f8fafc;color:#111827;font-weight:bold;font-size:14px}.small{font-size:11px;color:#cbd5e1;margin-top:7px}</style></head><body><div class="ui top"><h1>AR-учебник: Александр Пушкин</h1><p>Наведи камеру на тестовую страницу.</p><p id="status">Запуск камеры…</p></div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001" color-space="sRGB" renderer="alpha: true; colorManagement: true" background="color: transparent" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false" embedded><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity id="model" gltf-model="./pushkin.glb" position="0 -0.25 0.1" rotation="0 180 0" scale="0.35 0.35 0.35" visible="false"></a-entity><a-entity id="placeholder" position="0 0.05 0.12"><a-cylinder position="0 -0.22 0" radius="0.13" height="0.04" color="#d6d3d1"></a-cylinder><a-sphere position="0 0.05 0" radius="0.13" color="#d6b08b"></a-sphere><a-sphere position="0 0.16 0" radius="0.14" color="#2b211d"></a-sphere><a-box position="0 -0.12 0" width="0.26" height="0.22" depth="0.13" color="#202938"></a-box></a-entity></a-entity></a-scene><div class="ui bottom"><div class="buttons"><button id="intro">▶ О поэте</button><button id="birth">▶ Год рождения</button><button id="works">▶ Произведения</button><button id="stop">■ Остановить звук</button></div><div class="small">Нужны HTTPS, интернет и разрешение камеры. Озвучка использует голос браузера.</div></div><script>const statusEl=document.getElementById('status'),target=document.getElementById('target'),model=document.getElementById('model'),placeholder=document.getElementById('placeholder');function say(text){if(!('speechSynthesis'in window)){statusEl.textContent='Озвучка не поддерживается';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.88;speechSynthesis.speak(u)}document.getElementById('intro').onclick=()=>say('Александр Сергеевич Пушкин. Русский поэт, драматург и прозаик, один из основоположников современного русского литературного языка.');document.getElementById('birth').onclick=()=>say('Александр Сергеевич Пушкин родился шестого июня тысяча семьсот девяносто девятого года в Москве.');document.getElementById('works').onclick=()=>say('Среди известных произведений Александра Пушкина: Евгений Онегин, Капитанская дочка, Дубровский, Руслан и Людмила, Сказка о царе Салтане.');document.getElementById('stop').onclick=()=>speechSynthesis.cancel();const scene=document.querySelector('a-scene');scene.addEventListener('loaded',()=>statusEl.textContent='Сцена загружена. Запускаю камеру…');scene.addEventListener('arReady',()=>statusEl.textContent='Камера готова — наведи на страницу.');scene.addEventListener('arError',()=>statusEl.textContent='Ошибка AR: проверь HTTPS, интернет и разрешение камеры.');target.addEventListener('targetFound',()=>{statusEl.textContent='Страница распознана!';model.addEventListener('model-loaded',()=>{model.setAttribute('visible',true);placeholder.setAttribute('visible',false)},{once:true});model.addEventListener('model-error',()=>{statusEl.textContent='Страница найдена. Добавь pushkin.glb рядом с index.html.'},{once:true})});target.addEventListener('targetLost',()=>statusEl.textContent='Страница не видна — наведи камеру снова.');</script></body></html>
